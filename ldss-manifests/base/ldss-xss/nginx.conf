# nginx.default


include /etc/nginx/mime.types;

server {
    listen 8080;
    server_name ldss.staging.dso.mil;

    location /static {
        disable_symlinks on;
        root /usr/share/nginx/html;
    }

    location /media {
        disable_symlinks on;
        root /usr/share/nginx/html;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://localhost:8020/;
    }

    location /bolt/ {
        rewrite ^/bolt/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "Upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_pass         http://neo4j:7687/;
    }

    location /hello {
        add_header Content-Type text/html;
        return 200 '<html><body>Hello!</body></html>';
    }

    # location /browserbrowser/ {
    #     proxy_set_header Accept-Encoding "";
    #     sub_filter 'return new WebSocket(e)' 'return new WebSocket(e+"/ldss-xss/bolt/")';
    #     sub_filter_once off;
    #     sub_filter_types "*";

    #     proxy_pass http://neo4j:7474/browser/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Content-Type text/html;
    #     return 200 '<html><body>Hello!</body></html>';
    # }

    location /browser/ {
        proxy_set_header Accept-Encoding "";
        sub_filter 'return new WebSocket(e)' 'return new WebSocket(e+"/ldss-xss/bolt/")';
        sub_filter_once off;
        sub_filter_types "*";

        proxy_pass http://neo4j:7474/browser/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
